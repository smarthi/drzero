services:
  # Restate Server - Durable Execution Runtime
  restate:
    image: docker.restate.dev/restatedev/restate:latest
    container_name: restate-server
    ports:
      - "8080:8080"   # Ingress (API calls)
      - "9070:9070"   # Admin API
      - "9071:9071"   # Metrics
    environment:
      - RESTATE_LOG_FILTER=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9070/health"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dr-zero-net

  # Search Agent Service
  agent:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir restate-sdk hypercorn starlette numpy httpx opensearch-py
        COPY agent.py rag_pipeline.py query_expander.py ./
        EXPOSE 9080
        CMD ["python", "agent.py"]
    container_name: dr-zero-agent
    ports:
      - "9080:9080"
    environment:
      - USE_MOCK_LLM=true
      - USE_MOCK_EMBEDDINGS=true
    depends_on:
      restate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dr-zero-net

  # Streamlit UI
  ui:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        RUN pip install --no-cache-dir streamlit httpx
        COPY ui.py ./
        RUN mkdir -p /root/.streamlit && echo '[server]\nheadless = true\nport = 8501\nenableCORS = false\nenableXsrfProtection = false\n' > /root/.streamlit/config.toml
        EXPOSE 8501
        CMD ["streamlit", "run", "ui.py", "--server.address=0.0.0.0"]
    container_name: dr-zero-ui
    ports:
      - "8501:8501"
    environment:
      - RESTATE_URL=http://restate:8080
    depends_on:
      - agent
      - register
    networks:
      - dr-zero-net

  # Registration helper - registers agent with Restate
  register:
    image: curlimages/curl:latest
    container_name: dr-zero-register
    depends_on:
      restate:
        condition: service_healthy
      agent:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'Registering agent...' && sleep 2 && curl -X POST http://restate:9070/deployments -H 'Content-Type: application/json' -d '{\"uri\": \"http://agent:9080\"}' && echo '' && echo 'Demo ready! UI: http://localhost:8501'"]
    networks:
      - dr-zero-net

networks:
  dr-zero-net:
    name: dr-zero-network